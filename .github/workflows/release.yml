name: Release

# Publishing is OIDC trusted publishing on both registries: `vsce publish --oidc` and
# `ovsx publish --trusted-publishing` exchange a workflow-scoped identity token for a
# short-lived credential, so no PAT is stored anywhere. Global Azure DevOps PATs are retired
# on 2026-12-01 (see docs/release/trusted-publishing.md).
#
# The two publishes are independent on purpose. A version number cannot be reused, so if one
# registry accepts and the other fails, re-running the whole job fails on the registry that
# already succeeded. `workflow_dispatch` therefore takes a flag per registry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish to the VS Code Marketplace
        type: boolean
        default: true
      publish_openvsx:
        description: Publish to Open VSX
        type: boolean
        default: true

permissions:
  contents: write # read + create GitHub Release
  # Required by `vsce publish --oidc`: without it there is no id-token to exchange.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 12.16.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # Same gate as CI, re-run on the tagged commit: a tag is not evidence that the
      # tree passed, so we do not take main.yml's word for it.
      - name: Check, build, verify UI
        run: xvfb-run -a pnpm check:full

      # Packaging prerequisites that only fail at the last step of a release: a missing icon,
      # a version the Marketplace will not accept, a tag that does not match package.json.
      # A manual dispatch has no tag, so the tag check is skipped there.
      - name: Release preflight
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            pnpm run check:release -- --tag="${GITHUB_REF_NAME}"
          else
            pnpm run check:release
          fi

      - name: Package vsix
        run: pnpm run package

      - name: Upload vsix
        uses: actions/upload-artifact@v6
        with:
          name: release-vsix
          path: "*.vsix"
          if-no-files-found: error

      # Publishing is behind a repository variable, not behind a tag alone. Trusted publishing
      # needs a policy on the Marketplace and a trusted publisher on Open VSX, neither of which
      # exists yet; without the switch every tag would go red *after* passing the gate, which
      # makes a red X mean "not configured" instead of "something broke".
      #
      # Until it is configured, a tag runs the gate, packages, and uploads the artifact — which
      # is exactly what a GitHub release needs. Set the variable with:
      #   gh variable set PUBLISH_ENABLED --repo GaussAA/vscode-office --body true
      #
      # A manual dispatch can still publish (or finish a half-finished release) on its own,
      # because a version number cannot be reused once one registry has taken it.
      - name: Publish to VS Code Marketplace (OIDC)
        if: (startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true') || inputs.publish_marketplace
        run: pnpm exec vsce publish --no-dependencies --oidc --packagePath ./office-viewer-plus-*.vsix

      # `--trusted-publishing` fails rather than falling back to a PAT: if the Open VSX trusted
      # publisher is not registered yet, this step goes red instead of silently using a secret.
      - name: Publish to Open VSX (trusted publishing)
        if: (startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true') || inputs.publish_openvsx
        run: pnpm exec ovsx publish --no-dependencies --trusted-publishing ./office-viewer-plus-*.vsix

      # Create GitHub Release automatically on tag push. Extract the version from the tag
      # (refs/tags/v6.4.5 → 6.4.5), pull the corresponding CHANGELOG section, compute the VSIX
      # SHA256, and attach the VSIX. Idempotent: checks whether the release exists first, and
      # only creates if missing. Only runs on tag pushes when both registries succeeded; manual
      # dispatch does not create a release (it is for republishing an existing version).
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release v$VERSION already exists, skipping"
            exit 0
          fi
          BODY=$(node scripts/extract-changelog.mjs "$VERSION")
          VSIX=$(ls office-viewer-plus-*.vsix)
          SHA256=$(sha256sum "$VSIX" | awk '{print $1}')
          NOTES=$(cat <<EOF
          $BODY

          ## Install

          Download \`$VSIX\` and run \`code --install-extension $VSIX\`, or install \`GaussAA.office-viewer-plus\` from the VS Code Marketplace or Open VSX.

          SHA256: \`$SHA256\`

          Built by the Release workflow after \`check:full\` and the release preflight passed. Published to the VS Code Marketplace and Open VSX through OIDC trusted publishing.
          EOF
          )
          gh release create "v$VERSION" "$VSIX" \
            --repo "${{ github.repository }}" \
            --title "Data File Viewer (Parquet, JSONL, Excel) v$VERSION" \
            --notes "$NOTES" \
            --latest
