name: Release

# Publishing is OIDC trusted publishing on both registries: `vsce publish --oidc` and
# `ovsx publish --trusted-publishing` exchange a workflow-scoped identity token for a
# short-lived credential, so no PAT is stored anywhere. Global Azure DevOps PATs are retired
# on 2026-12-01 (see docs/release/trusted-publishing.md).
#
# The two publishes are independent on purpose. A version number cannot be reused, so if one
# registry accepts and the other fails, re-running the whole job fails on the registry that
# already succeeded. `workflow_dispatch` therefore takes a flag per registry.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish to the VS Code Marketplace
        type: boolean
        default: true
      publish_openvsx:
        description: Publish to Open VSX
        type: boolean
        default: true

permissions:
  contents: read
  # Required by `vsce publish --oidc`: without it there is no id-token to exchange.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same gate as CI, re-run on the tagged commit: a tag is not evidence that the
      # tree passed, so we do not take main.yml's word for it.
      - name: Check, build, verify UI
        run: xvfb-run -a pnpm check:full

      # Packaging prerequisites that only fail at the last step of a release: a missing icon,
      # a version the Marketplace will not accept, a tag that does not match package.json.
      # A manual dispatch has no tag, so the tag check is skipped there.
      - name: Release preflight
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            pnpm run check:release -- --tag="${GITHUB_REF_NAME}"
          else
            pnpm run check:release
          fi

      - name: Package vsix
        run: pnpm run package

      - name: Upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: release-vsix
          path: '*.vsix'
          if-no-files-found: error

      # Guarded so a manual dispatch can package without publishing, and so a half-finished
      # release can be completed on the registry that did not take the version.
      - name: Publish to VS Code Marketplace (OIDC)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_marketplace
        run: pnpm exec vsce publish --no-dependencies --oidc --packagePath ./office-viewer-plus-*.vsix

      # `--trusted-publishing` fails rather than falling back to a PAT: if the Open VSX trusted
      # publisher is not registered yet, this step goes red instead of silently using a secret.
      - name: Publish to Open VSX (trusted publishing)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_openvsx
        run: pnpm exec ovsx publish --no-dependencies --trusted-publishing ./office-viewer-plus-*.vsix
