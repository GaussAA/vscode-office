name: CI
on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 12.16.1
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - name: Build
      run: |
        echo ">>> Start compile office-viewer-plus."
        pnpm build
        echo ">>> Compile ok."
    - name: UI verification (headless DOM assertions)
      run: xvfb-run -a pnpm verify:ui
    - name: Package vsix
      run: pnpm dlx @vscode/vsce package --no-dependencies


