# Temporary: reproduce an environment-specific flake on the platform it happens on.
#
# The column-jump failure never reproduces on Windows and never under CPU throttling, which
# points at the runner (Linux headless + xvfb + font metrics), not at speed. This workflow runs
# one scenario N times and prints the whole log of every failing run, so the diagnostic the
# scenario now emits lands in CI output. Delete it once the flake is fixed.
name: Repro

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: How many times to run the scenario
        default: "30"
      scenario:
        description: Value for --filter
        default: parquet-json-links-column-jump

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12.16.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Loop the scenario
        run: |
          set -uo pipefail
          fails=0
          repeats="${{ inputs.repeats }}"
          for i in $(seq 1 "$repeats"); do
            log="/tmp/run-$i.log"
            xvfb-run -a node scripts/ui-verify/runner.mjs --filter="${{ inputs.scenario }}" > "$log" 2>&1
            if grep -q "FAIL" "$log"; then
              fails=$((fails + 1))
              echo "=== FAILURE on run $i ==="
              cat "$log"
            else
              echo "run $i ok"
            fi
          done
          echo "failures: $fails / $repeats"
          test "$fails" -eq 0
